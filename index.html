<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 酒酒的歌单</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #f7f0ff 0%, #eedffb 40%, #e4d0f5 100%);
    min-height: 100vh;
    color: #4a3a5c;
    padding: 20px;
  }
  .container { max-width: 800px; margin: 0 auto; }
  .header {
    text-align: center;
    padding: 40px 20px 30px;
  }
  .header h1 {
    font-size: 28px;
    color: #6b4e8e;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .header .sub {
    font-size: 14px;
    color: #9a8bb0;
  }
  .toolbar {
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    box-shadow: 0 2px 12px rgba(155,126,200,0.1);
  }
  .toolbar label { font-size: 13px; color: #9a8bb0; }
  select {
    background: #fff;
    border: 1px solid #d4c5e8;
    color: #6b4e8e;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  select option { background: #fff; color: #4a3a5c; }
  .sort-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .sort-btn {
    background: #fff;
    border: 1px solid #d4c5e8;
    color: #9a8bb0;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .sort-btn:hover { background: #f0e6ff; color: #6b4e8e; }
  .sort-btn.active {
    background: #9b7ec8;
    border-color: #9b7ec8;
    color: #fff;
  }
  .hint {
    font-size: 12px;
    color: #b0a0c8;
    margin-left: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 16px rgba(155,126,200,0.12);
  }
  thead { background: rgba(155,126,200,0.1); }
  th {
    padding: 12px 16px;
    text-align: left;
    font-size: 13px;
    color: #8a6ea8;
    font-weight: 500;
  }
  td {
    padding: 14px 16px;
    font-size: 14px;
    border-top: 1px solid rgba(212,197,232,0.4);
  }
  tr:hover td { background: rgba(240,230,255,0.5); }
  .num { color: #b0a0c8; width: 40px; }
  .song-name { color: #4a3a5c; font-weight: 500; }
  .artist { color: #8a7a9e; }
  .album { color: #a898bc; font-size: 13px; }
  .duration { color: #9a8bb0; text-align: right; }
  .tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 8px;
    background: rgba(155,126,200,0.15);
    color: #9b7ec8;
  }
  .tag.jp { background: rgba(100,150,230,0.15); color: #6a8fd8; }
  .tag.game { background: rgba(120,180,130,0.15); color: #6aaa78; }
  .tag.gufeng { background: rgba(220,170,100,0.15); color: #c89a5a; }
  .footer {
    text-align: center;
    padding: 30px;
    font-size: 12px;
    color: #b0a0c8;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎵 我的歌单</h1>
    <div class="sub">酒酒 · 共 10 首 · 点击排序按钮组合排序</div>
  </div>

  <div class="toolbar">
    <label>分类：</label>
    <select id="category">
      <option value="all">全部种类</option>
      <option value="华语">华语</option>
      <option value="日语">日语</option>
      <option value="游戏ACG">游戏ACG</option>
      <option value="古风">古风</option>
    </select>
    <div class="sort-btns">
      <button class="sort-btn" data-sort="num">序号</button>
      <button class="sort-btn" data-sort="song">歌名</button>
      <button class="sort-btn" data-sort="artist">歌手</button>
      <button class="sort-btn" data-sort="duration">时长</button>
    </div>
    <span class="hint">提示：点多个按钮按顺序叠加排序</span>
  </div>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>歌曲</th>
        <th>歌手</th>
        <th>专辑</th>
        <th style="text-align:right">时长</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="footer">QQ音乐歌单分享 · 扫一扫听好歌</div>
</div>

<script>
const songs = [
  { num:1, song:"弄舌", artist:"王子健", album:"弄舌", dur:"03:17", cat:["华语"] },
  { num:2, song:"琥珀色浪漫", artist:"洛少爷", album:"琥珀色浪漫", dur:"03:35", cat:["华语","古风"] },
  { num:3, song:"昔涟", artist:"张韶涵 / HOYO-MiX", album:"崩坏星穹铁道-昔涟", dur:"03:06", cat:["华语","游戏ACG"] },
  { num:4, song:"深海少女", artist:"篠螺悠那 / 初音未来", album:"初音ミク 5thバースデー", dur:"03:36", cat:["日语"] },
  { num:5, song:"夢と葉桜 (梦与叶樱)", artist:"青木月光 / 初音未来", album:"V love 25", dur:"04:13", cat:["日语"] },
  { num:6, song:"ブルーバード (青鸟)", artist:"生物股长", album:"火影忍者OP", dur:"03:38", cat:["日语","游戏ACG"] },
  { num:7, song:"山河图鉴", artist:"原来是萝卜丫", album:"山河图鉴", dur:"03:07", cat:["华语","古风"] },
  { num:8, song:"不凡2024", artist:"王铮亮", album:"凡人修仙传 结婴曲", dur:"04:12", cat:["华语","游戏ACG"] },
  { num:9, song:"不绸缪", artist:"Cathy月月", album:"不绸缪", dur:"03:15", cat:["华语"] },
  { num:10, song:"时梦", artist:"Zuayean", album:"时梦", dur:"03:12", cat:["华语"] },
];

let activeSorts = [];
let currentCat = "all";

function durToSec(d) {
  const [m,s] = d.split(":").map(Number);
  return m*60+s;
}

function render() {
  let list = songs.filter(s => currentCat==="all" || s.cat.includes(currentCat));
  if (activeSorts.length > 0) {
    list = [...list].sort((a,b) => {
      for (const key of activeSorts) {
        let av, bv;
        if (key==="num") { av=a.num; bv=b.num; }
        else if (key==="song") { av=a.song; bv=b.song; }
        else if (key==="artist") { av=a.artist; bv=b.artist; }
        else if (key==="duration") { av=durToSec(a.dur); bv=durToSec(b.dur); }
        if (av < bv) return -1;
        if (av > bv) return 1;
      }
      return 0;
    });
  }
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = list.map((s,i) => {
    let tags = "";
    if (s.cat.includes("日语")) tags += '<span class="tag jp">日语</span>';
    if (s.cat.includes("游戏ACG")) tags += '<span class="tag game">ACG</span>';
    if (s.cat.includes("古风")) tags += '<span class="tag gufeng">古风</span>';
    return `<tr>
      <td class="num">${i+1}</td>
      <td class="song-name">${s.song}${tags}</td>
      <td class="artist">${s.artist}</td>
      <td class="album">${s.album}</td>
      <td class="duration">${s.dur}</td>
    </tr>`;
  }).join("");
}

document.getElementById("category").addEventListener("change", e => {
  currentCat = e.target.value;
  render();
});

document.querySelectorAll(".sort-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const key = btn.dataset.sort;
    const idx = activeSorts.indexOf(key);
    if (idx >= 0) {
      activeSorts.splice(idx, 1);
      btn.classList.remove("active");
    } else {
      activeSorts.push(key);
      btn.classList.add("active");
    }
    render();
  });
});

render();
</script>
</body>
</html>
